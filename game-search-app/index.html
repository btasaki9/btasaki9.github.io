<!DOCTYPE html>
<html>
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Game Search App</title>
   <link rel="stylesheet" href="styles.css">
   <script src="scripts.js" defer></script>
</head>

<body>
   <div id="header">
      <h1>Game-Search.com</h1>
   </div>
   <div id="search">
       <form id="search-form">
         <input type="text" id="search-input" placeholder="Search for games...">
         <button type="submit" id="search-button">Search</button>
      </form>
   </div>

   <div id="results">
      <h2 id="game-title"></h2>

      <div id="details">
         <div id="date">
            <h3>Release Date</h3>
            <p id="game-released"></p>
         </div>
         <div id="ratings">
            <div id="ratings">
               <h3>Metacritic</h3>
               <p id="game-metacritic">96 / 100</p>
            </div>
            <div id="opencritic-rating">
               <h3>OpenCritic</h3>
               <p id="game-opencritic">97 / 100</p>
            </div>
         </div>
         <div id="image">
            <img id="game-cover" src="" alt="Game cover image">
         </div>
      </div>
   </div>
</body>
</html>
